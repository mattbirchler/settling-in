name: Settle
options:
  bundleIdPrefix: me.birchtree
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

# Parsing and data reading live in a local Swift package so they test on the Mac with `swift test`.
packages:
  SettleCore:
    path: Packages/SettleCore

targets:
  Settle:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: settling-in-icon.icon
    dependencies:
      - package: SettleCore
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.birchtree.Settle
        PRODUCT_NAME: Settling In
        MARKETING_VERSION: "0.2"
        CURRENT_PROJECT_VERSION: 2
        SWIFT_VERSION: 6.0
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_HARDENED_RUNTIME: YES
        # Not sandboxed: it reads other processes, the power log and the Photos database.
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Settling In
        ASSETCATALOG_COMPILER_APPICON_NAME: settling-in-icon
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Matt Birchler"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES
